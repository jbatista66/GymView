// ===== RECHENKERN =====
function e1rm(w, r) { return w * r * 0.0333 + w; }          // Smartgains-Formel
function roundTo(w, inc) { return inc ? Math.round(w / inc) * inc : w; }
function fmtKg(w) {
  const v = Math.round(w * 100) / 100;
  return (Number.isInteger(v) ? v.toString() : v.toFixed(2).replace(/0$/, '')).replace('.', ',');
}
function rmMetaKey(lift) {
  return { kreuzheben:"Kreuzheben", bankdruecken:"Bankdrücken", ueberkopfdruecken:"Überkopfdrücken",
           pendlayRows:"Pendlay Rows", schraegbankdruecken:"Schrägbankdrücken", kniebeuge:"Kniebeuge" }[lift];
}
// Arbeitsgewicht der Fokusuebungen = 1RM x Intensitaet, gerundet auf das ladbare Inkrement
function pct(lift, p) {
  const d = exLog[rmMetaKey(lift)] || { inc: 2.5 };
  return roundTo(oneRM[lift] * p / 100, d.inc);
}

// ===== PROGRESSION FUER DIE NEBENUEBUNGEN (Doppelprogression, RPE 8-9 / 1-2 RIR) =====
// Regel: mehr Wdh. als gefordert geschafft -> Gewicht rauf. Zielwdh. knapp verpasst ->
// Gewicht halten und erst die Wdh. voll machen (Guide S. 25: "Bleibe so lange bei dem Gewicht").
function targetReps(reps) {
  const m = String(reps).match(/\d+/);
  if (!m) return null;                 // AMRAP, "*", Zeitangaben
  const n = parseInt(m[0], 10);
  return n > 20 ? null : n;            // "45 Gesamtwdh." / "40 Wdh. in 4 Minuten"
}

function suggest(name, reps) {
  const d = exLog[name];
  if (!d) return null;
  const tr = targetReps(reps);
  if (d.bw) {
    const extra = (tr !== null && d.lastR >= tr + 2) ? d.inc : 0;
    return { d, tr, bw: true, kg: extra, hold: extra === 0, next: d.inc };
  }
  if (tr === null) return { d, tr: null, open: true, kg: d.lastW, hold: true, next: roundTo(d.lastW + d.inc, d.inc) };
  const gap = d.lastR - tr;
  let step = 0;
  if (gap >= 3) step = 0.05;            // klar Luft nach oben
  else if (gap >= 1) step = 0.03;       // Zielwdh. uebertroffen
  else if (gap === 0) step = 0.015;     // Zielwdh. genau getroffen
  let raw = e1rm(d.lastW, d.lastR) * (1 + step) / (1 + tr * 0.0333);
  if (gap >= -2 && raw < d.lastW) raw = d.lastW;   // 1-2 Wdh. gefehlt -> Gewicht halten
  if (raw > d.lastW * 1.10) raw = d.lastW * 1.10;  // Deckel: max +10% pro Einheit
  let kg = roundTo(raw, d.inc);
  if (kg < d.inc) kg = d.inc;
  if (kg - d.lastW > d.inc) kg = d.lastW + d.inc;  // nie mehr als eine Stufe pro Einheit
  return { d, tr, kg, hold: kg === d.lastW, down: kg < d.lastW, next: kg + d.inc };
}
